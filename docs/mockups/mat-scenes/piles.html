<style>

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ork-room); color: var(--ork-ink); font: var(--ork-type-body); overflow: hidden; }
body[data-face="desk"] { width: 1440px; height: 900px; }
body[data-face="phone"] { width: 390px; height: 844px; --cw: 64px; --ch: 88px; --tk: 38px; --pouch: 36px; --prop: 91px; --em: 32px; --band: 50px;
  --PW: 290px; --hcw: 66px; --hch: 92px; }
.stage { position: absolute; inset: 2.5%; }
.field { position: absolute; inset: 0; border: 4px solid var(--ork-bronze); border-radius: var(--ork-radius-card); box-shadow: 0 4px 0 var(--ork-plate); overflow: hidden; background: var(--ork-room); }
.field::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; filter: brightness(.5); }
.prop { position: absolute; z-index: 20; pointer-events: none; filter: brightness(.47) saturate(.9); }
.prop img { display: block; max-width: var(--prop); max-height: var(--prop); width: auto; height: auto; }
.prop.tl { left: -4px; top: -4px; } .prop.tr { right: -4px; top: -4px; } .prop.bl { left: -4px; bottom: -4px; } .prop.br { right: -4px; bottom: -4px; }

.top { position: absolute; top: 24px; left: 0; right: 0; display: flex; justify-content: center; z-index: 5; }

  background: var(--ork-plate); border: 1px solid var(--ork-bronze-lo); border-radius: var(--ork-radius-control); color: var(--ork-ink); white-space: nowrap; }

.plate { position: relative; text-align: center; padding: 6px 18px 8px; background: var(--ork-plate); border: 2px solid var(--ork-bronze); border-radius: var(--ork-radius-control); box-shadow: 0 3px 0 var(--ork-room); }

.plate span { display: block; font: var(--ork-type-caption); color: var(--ork-ink-read); }

body[data-face="phone"] .plate .full { display: none; } body[data-face="phone"] .plate .short { display: inline; }
.tk { position: relative; width: var(--tk); height: var(--tk); border-radius: 50%; background: var(--ork-room); border: 3px solid var(--hue, var(--ork-party-ork)); display: grid; place-items: center; overflow: hidden; box-shadow: 0 3px 0 var(--ork-plate); flex: none; }
.tk img { width: 112%; height: 112%; object-fit: cover; object-position: center 20%; }
.tech { --hue: var(--ork-party-ork); } .design { --hue: var(--ork-party-elf); } .product { --hue: var(--ork-party-knight); }
/* cards */
.card { --g: 28px; position: relative; width: var(--cw); height: var(--ch); padding: 8px 6px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px;
  background: var(--ork-card); border: 2px solid var(--ork-card-frame); border-radius: var(--ork-radius-card); box-shadow: 0 4px 0 var(--ork-plate); }
.card .hd { width: 46px; height: 46px; object-fit: contain; flex: none; }
.card b.t { font: 700 14px/1.2 var(--ork-font-text); }
.card .ln { font-size: 12px; line-height: 1.3; color: var(--ork-ink-read); }
.gw { position: absolute; z-index: 2; filter: drop-shadow(0 2px 0 var(--ork-room)); }
.gw.tl { left: 5px; top: 5px; } .gw.tr { right: 5px; top: 5px; }
.gem { display: grid; place-items: center; width: var(--g); height: var(--g); background: var(--rim, var(--ork-bronze-hi)); position: relative; }
.gem .in { position: absolute; inset: 3px; background: var(--ork-plate); display: grid; place-items: center; font: 700 calc(var(--g) * .5)/1 var(--ork-font-text); color: var(--ork-gilt-hi); }
.gem.circle, .gem.circle .in { border-radius: 50%; }

.gem .ru { width: 62%; height: 62%; background: var(--ork-ink-read); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }

.card .when { position: absolute; left: 6px; bottom: 6px; padding: 1px 6px; font: 500 11px/14px var(--ork-font-text); color: var(--ork-ink-muted); background: var(--ork-plate); border: 1px solid var(--ork-bronze-lo); border-radius: 4px; }
.card .act { position: absolute; right: 6px; bottom: 6px; padding: 2px 10px; font: 700 12px/14px var(--ork-font-text); color: var(--ork-on-ink); background: var(--ork-action); border-radius: 4px; box-shadow: 0 2px 0 var(--ork-room); }

.gw.tl { left: 4px; top: 4px; }

/* buttons */
.btn { display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px; font: var(--ork-type-button); color: var(--ork-ink); white-space: nowrap;
  background: var(--ork-plate); border: 2px solid var(--ork-bronze-hi); border-radius: var(--ork-radius-control); box-shadow: 0 3px 0 var(--ork-room); }
.btn i.ic { width: 18px; height: 18px; background: var(--ork-ink-read); flex: none; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.btn.ready { border-color: var(--ork-gilt-hi); box-shadow: 0 0 0 2px var(--ork-ink), 0 5px 0 2px var(--ork-room); } .btn.ready i.ic { background: var(--ork-gilt-hi); }
.btn.dim { opacity: .5; border-style: dashed; box-shadow: none; filter: saturate(.4); }
.note { font: 600 12px/15px var(--ork-font-text); color: var(--ork-ink-read); background: var(--ork-plate); padding: 2px 7px; border-radius: 4px; text-align: center; }
.note.warn { color: var(--ork-alert); } .note.mana { color: var(--ork-mana); }
/* pouch */
.pouchbar { position: absolute; z-index: 6; left: 1020px; bottom: 40px; display: flex; align-items: center; gap: 8px; }
.pouch { width: var(--pouch); height: var(--pouch); background: var(--ork-bronze-hi); flex: none; -webkit-mask: url(../battle-field/emblems/pouch.png) center / contain no-repeat; mask: url(../battle-field/emblems/pouch.png) center / contain no-repeat; }
.pouchbar .cap { position: absolute; left: 0; bottom: calc(100% + 4px); white-space: nowrap; display: flex; gap: 8px; align-items: center; font: 600 13px/16px var(--ork-font-text); background: var(--ork-plate); padding: 2px 8px; border-radius: 4px; }
.pouchbar .trow, .pouchbar .trow.desk-only { display: grid; grid-template-columns: repeat(2, 36px); gap: 6px; }

.desk-only { display: block; } body[data-face="phone"] .desk-only { display: none; }
.phone-only { display: none; } body[data-face="phone"] .phone-only { display: block; }
.btn { display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px; font: var(--ork-type-button); color: var(--ork-ink); white-space: nowrap; background: var(--ork-plate); border: 2px solid var(--ork-bronze-hi); border-radius: var(--ork-radius-control); box-shadow: 0 3px 0 var(--ork-room); }

/* ---- v3: S cards, tool tokens, slips on threads, the minimal hand ---- */
.prop.tl, .prop.br { display: none !important; }
body[data-face="phone"] .prop.bl { display: none !important; }
body .party-tech, .tech { --hue: var(--ork-party-ork); } .design { --hue: var(--ork-party-elf); } .product { --hue: var(--ork-party-knight); }

.tok .ring { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--hue); background: var(--ork-plate); display: grid; place-items: center; box-shadow: 0 2px 0 var(--ork-room); }

.ck { display: flex; gap: 1px; height: 8px; align-items: center; justify-content: center; }

.tok.lg .ring { width: 46px; height: 46px; border-width: 3px; } .tok.lg .ring img { width: 28px; height: 28px; }

.tok.gate .ring i { width: 14px; height: 14px; background: var(--ork-action); -webkit-mask: url(../../../design-system/orkui/signs/check.svg) center / contain no-repeat; mask: url(../../../design-system/orkui/signs/check.svg) center / contain no-repeat; }

.tok.und .ring { border-style: dashed; opacity: .75; }

.slip { position: absolute; z-index: 9; width: 176px; padding: 5px 7px 6px 8px; background: var(--ork-plate); border: 1px solid var(--ork-bronze-lo); border-left: 4px solid var(--hue); border-radius: 4px; box-shadow: 0 3px 0 var(--ork-room);
  font: 500 11px/14px var(--ork-font-text); color: var(--ork-ink-read); text-align: left; }
.slip .who { display: flex; gap: 5px; align-items: center; font: 700 11px/14px var(--ork-font-text); color: var(--ork-ink); margin-bottom: 2px; }
.slip .who img { width: 18px; height: 18px; object-fit: cover; object-position: center 20%; border-radius: 50%; background: var(--ork-room); }

    });

  }
